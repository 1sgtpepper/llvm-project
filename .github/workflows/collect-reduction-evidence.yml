name: Inspect wide vector reduction profiles

on:
  push:
    branches: [inspect-wide-vector-boundaries]

permissions:
  contents: read
  actions: read

jobs:
  profile:
    if: github.repository == '1sgtpepper/llvm-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover the existing profile and exact baseline compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p measurements
          gh run download 34754349165 --repo 1sgtpepper/llvm-project \
            --name wide-vector-reduction-irregular-boundaries --dir measurements/profile
          gh run download 34746063798 --repo 1sgtpepper/llvm-project \
            --name wide-vector-reduction-baseline-compiler --dir "$RUNNER_TEMP/compiler-artifact"
          mkdir -p "$RUNNER_TEMP/previous-comparison/baseline"
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import os
          import shutil
          root = Path(os.environ["RUNNER_TEMP"])
          candidates = list((root / "compiler-artifact").rglob("llc"))
          assert len(candidates) == 1
          compiler = candidates[0]
          expected = "71d88d173800d1d1ba6af1a4f387023208c7e37606b559302bba7e301449b586"
          assert hashlib.sha256(compiler.read_bytes()).hexdigest() == expected
          shutil.copy2(compiler, root / "previous-comparison/baseline/llc")
          Path("measurements/compiler.sha256").write_text(expected + "\n")
          PYTHON
      - name: Resolve the recorded call chains without recompiling the input
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic
          perf_bin=$(find /usr/lib -type f -name perf | sort | tail -1)
          "$perf_bin" report --stdio --children --percent-limit=1.0 \
            --call-graph graph,1,caller -i measurements/profile/sm100.perf.data \
            > measurements/sm100-callers.txt 2> measurements/report-status.txt
      - name: Retain the resolved call chains
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wide-vector-reduction-irregular-callers
          path: |
            measurements/sm100-callers.txt
            measurements/report-status.txt
            measurements/compiler.sha256
          retention-days: 14
