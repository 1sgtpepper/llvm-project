name: Wide vector reduction investigation

on:
  push:
    branches: [validate-wide-vector-reduction]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: github.repository == '1sgtpepper/llvm-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          sparse-checkout: .ci
      - name: Preserve the investigation drivers
        run: cp -a .ci "$RUNNER_TEMP/reduction-drivers"
      - name: Check out the exact compiler change
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 71e61810012340dbfdfbe93be4d8baa9e3d55fe2
          fetch-depth: 2
          persist-credentials: false
      - name: Recover the baseline and record provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p measurements
          cp -a "$RUNNER_TEMP/reduction-drivers/." .ci/
          gh run download 34746063798 --repo 1sgtpepper/llvm-project \
            --name wide-vector-reduction-baseline-compiler --dir measurements/baseline
          chmod +x measurements/baseline/llc
          git rev-parse HEAD > measurements/revision.txt
          git diff 0d55d0bf81ce2e0d6d3c46b7835efb788bde634a -- llvm > measurements/compiler.patch
          uname -a > measurements/kernel.txt
          lscpu > measurements/cpu.txt
          free -h > measurements/memory.txt
      - name: Install build and profiling tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build clang lld linux-tools-generic
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          key: wide-vector-reduction-ubuntu-24.04
          max-size: 4G
      - name: Configure with the baseline compiler options
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS='-gline-tables-only -fno-omit-frame-pointer' \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_USE_LINKER=lld -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TARGETS_TO_BUILD='NVPTX;X86' \
            -DLLVM_PARALLEL_LINK_JOBS=1 -DLLVM_INCLUDE_BENCHMARKS=OFF
          cp build/CMakeCache.txt measurements/
      - name: Build the exact candidate and focused test tools
        id: build
        run: |
          ninja -C build -j4 llc opt FileCheck llvm-as llvm-dis llvm-config count not split-file
          mkdir -p measurements/candidate
          cp build/bin/llc measurements/candidate/llc
          sha256sum measurements/{baseline,candidate}/llc > measurements/compiler.sha256
      - name: Build actual-owner baseline and candidate harnesses
        if: always() && steps.build.outcome == 'success'
        run: |
          owner=llvm/lib/CodeGen/SelectionDAG/ScheduleDAGRRList.cpp
          trap 'git restore -- "$owner"' EXIT
          for label in candidate baseline; do
            if [ "$label" = baseline ]; then
              git show 0d55d0bf81ce2e0d6d3c46b7835efb788bde634a:"$owner" > "$owner"
            fi
            clang++ $(build/bin/llvm-config --cxxflags) -O3 -UNDEBUG -fuse-ld=lld \
              -fno-omit-frame-pointer .ci/scheduler-path-check.cpp \
              -o "measurements/paths-$label" \
              $(build/bin/llvm-config --ldflags --link-static --libs selectiondag --system-libs)
          done
      - name: Check graph families, cached paths, cycles and isolated scaling
        if: always() && steps.build.outcome == 'success'
        run: |
          ulimit -c 0
          python3 .ci/check-scheduler-paths.py measurements
      - name: Check existing NVPTX reduction and packing regressions
        if: always() && steps.build.outcome == 'success'
        run: |
          build/bin/llvm-lit -v \
            llvm/test/CodeGen/NVPTX/reduction-intrinsics.ll \
            llvm/test/CodeGen/NVPTX/fp-contract-f32x2.ll \
            2>&1 | tee measurements/reduction-tests.txt
      - name: Compare complete compilation on the same host
        if: always() && steps.build.outcome == 'success'
        run: |
          ulimit -c 0
          ulimit -v 8388608
          python3 .ci/wide-vector-reduction.py \
            --compiler baseline measurements/baseline/llc \
            --compiler candidate measurements/candidate/llc --output measurements/timing \
            --widths 1024 4096 16384 65536 --repetitions 3 --timeout 180
      - name: Count the remaining successor-query paths in a separate diagnostic build
        if: always() && steps.build.outcome == 'success'
        run: |
          owner=llvm/lib/CodeGen/SelectionDAG/ScheduleDAGRRList.cpp
          trap 'git restore -- "$owner"' EXIT
          python3 .ci/count-closest-successors.py
          git diff -- llvm > measurements/diagnostic.patch
          ninja -C build -j4 llc
          ulimit -c 0
          for kind in ordered reassoc no-reduce; do
            timeout --kill-after=5s 180s build/bin/llc \
              "measurements/timing/inputs/$kind-65536.ll" -o /dev/null \
              2> "measurements/$kind-closest-counts.txt"
            cat "measurements/$kind-closest-counts.txt"
          done
      - name: Retain comparison compilers and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wide-vector-reduction-comparison
          path: measurements
          retention-days: 14
