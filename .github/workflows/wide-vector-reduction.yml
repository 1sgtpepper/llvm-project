name: Wide vector reduction investigation

on:
  push:
    branches: [validate-wide-vector-reduction]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == '1sgtpepper/llvm-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          sparse-checkout: .ci
      - name: Preserve the investigation drivers
        run: cp -a .ci "$RUNNER_TEMP/reduction-drivers"
      - name: Check out the exact compiler change
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 0e48409311a1a3fcff7714c5e3adf4aab048771c
          fetch-depth: 3
          persist-credentials: false
      - name: Record the exact source and recover the driver
        run: |
          mkdir -p measurements
          cp -a "$RUNNER_TEMP/reduction-drivers/." .ci/
          git rev-parse HEAD > measurements/revision.txt
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build clang lld
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          key: wide-vector-reduction-ubuntu-24.04
          max-size: 4G
      - name: Configure with the baseline compiler options
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS='-gline-tables-only -fno-omit-frame-pointer' \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_USE_LINKER=lld -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TARGETS_TO_BUILD='NVPTX;X86' \
            -DLLVM_PARALLEL_LINK_JOBS=1 -DLLVM_INCLUDE_BENCHMARKS=OFF
          cp build/CMakeCache.txt measurements/
      - name: Build the matching libraries
        id: build
        run: ninja -C build -j4 llc llvm-config
      - name: Check successor-query lifetimes using the actual queue
        if: always() && steps.build.outcome == 'success'
        run: |
          fixture_cxxflags=$(build/bin/llvm-config --cxxflags)
          fixture_ldflags=$(build/bin/llvm-config --ldflags --link-static --libs selectiondag x86codegen asmparser --system-libs)
          clang++ $fixture_cxxflags -O3 -UNDEBUG -fuse-ld=lld \
            -DUSE_SUCCESSOR_CACHE .ci/successor-cache-check.cpp \
            -o measurements/successor-cache-check $fixture_ldflags
          timeout --kill-after=5s 180s measurements/successor-cache-check \
            2>&1 | tee measurements/cache-paths.txt
      - name: Retain comparison compilers and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: successor-cache-lifecycle-evidence
          path: measurements
          retention-days: 14
