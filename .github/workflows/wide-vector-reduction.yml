name: Check successor cache key distributions

on:
  push:
    branches: [validate-wide-vector-reduction]

permissions:
  contents: read

jobs:
  distributions:
    if: github.repository == '1sgtpepper/llvm-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          sparse-checkout: .ci
      - name: Preserve the actual-owner fixture
        run: cp -a .ci "$RUNNER_TEMP/reduction-drivers"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 4b74ad785e25e3d5628313b79ca621b332a619b8
          fetch-depth: 5
          persist-credentials: false
      - name: Install existing build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build clang lld
          cp -a "$RUNNER_TEMP/reduction-drivers/." .ci/
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          key: wide-vector-reduction-ubuntu-24.04
          max-size: 4G
      - name: Recover matching libraries through the compiler cache
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS='-gline-tables-only -fno-omit-frame-pointer' \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_USE_LINKER=lld -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TARGETS_TO_BUILD='NVPTX;X86' \
            -DLLVM_PARALLEL_LINK_JOBS=1 -DLLVM_INCLUDE_BENCHMARKS=OFF
          ninja -C build -j4 llvm-config LLVMSelectionDAG LLVMX86CodeGen LLVMAsmParser
      - name: Compare identical valid graphs with both exact queue implementations
        run: |
          mkdir -p measurements
          lscpu > measurements/cpu.txt
          cp build/CMakeCache.txt measurements/
          owner=llvm/lib/CodeGen/SelectionDAG/ScheduleDAGRRList.cpp
          trap 'git restore "$owner"' EXIT
          fixture_cxxflags=$(build/bin/llvm-config --cxxflags)
          fixture_ldflags=$(build/bin/llvm-config --ldflags --link-static --libs selectiondag x86codegen asmparser --system-libs)
          for label in pointer number; do
            if [ "$label" = pointer ]; then
              git show 7d21bcb2e0ef88bcb682430023bce7540bd9763b:"$owner" > "$owner"
            else
              git restore "$owner"
            fi
            git hash-object "$owner" > "measurements/$label-source.sha1"
            clang++ $fixture_cxxflags -O3 -UNDEBUG -fuse-ld=lld \
              .ci/successor-cache-strides.cpp -o "measurements/$label-strides" $fixture_ldflags
            sha256sum "measurements/$label-strides" > "measurements/$label-binary.sha256"
            ulimit -c 0
            ulimit -v 8388608
            timeout --kill-after=5s 180s "measurements/$label-strides" \
              > "measurements/$label.csv" 2> "measurements/$label.stderr"
            cat "measurements/$label.csv"
          done
      - name: Retain distribution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: successor-cache-distributions
          path: |
            measurements
            !measurements/pointer-strides
            !measurements/number-strides
          retention-days: 14
