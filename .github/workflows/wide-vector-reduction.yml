name: Wide vector reduction investigation

on:
  push:
    branches: [validate-wide-vector-reduction]

permissions:
  contents: read
  actions: read

jobs:
  profile:
    if: github.repository == '1sgtpepper/llvm-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          sparse-checkout: .ci
      - name: Recover the retained baseline compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34746063798 --repo 1sgtpepper/llvm-project \
            --name wide-vector-reduction-baseline-compiler --dir build/bin
          chmod +x build/bin/llc
          git fetch --no-tags --depth=2 origin c6a554b8b227e4ed876f0a48c7cb12f64b168901
      - name: Install profiling tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic
      - name: Record source and host
        run: |
          mkdir -p measurements
          git rev-parse HEAD > measurements/workflow-revision.txt
          echo c6a554b8b227e4ed876f0a48c7cb12f64b168901 > measurements/compiler-source.txt
          git diff 0d55d0bf81ce2e0d6d3c46b7835efb788bde634a c6a554b8b227e4ed876f0a48c7cb12f64b168901 -- llvm > measurements/compiler.patch
          uname -a > measurements/kernel.txt
          lscpu > measurements/cpu.txt
          sha256sum build/bin/llc > measurements/compiler.sha256
          build/bin/llc --version > measurements/compiler-version.txt
          python3 .ci/wide-vector-reduction.py --generate-only --output measurements \
            --widths 1024 4096 16384 65536
      - name: Capture sample profiles when the runner permits perf
        run: |
          ulimit -c 0
          perf_bin=$(find /usr/lib -type f -name perf | sort | tail -1)
          if [ -z "$perf_bin" ]; then
            echo 'No installed perf executable.' > measurements/perf-unavailable.txt
            exit 0
          fi
          for kind in ordered no-reduce; do
            timeout --kill-after=5s 180s sudo "$perf_bin" record -e cpu-clock:u -F 99 \
              --call-graph fp -o "measurements/$kind.perf.data" -- \
              build/bin/llc "measurements/inputs/$kind-65536.ll" -o /dev/null -time-passes \
              2> "measurements/$kind.perf-status.txt" || continue
            sudo "$perf_bin" report --stdio --no-children \
              -i "measurements/$kind.perf.data" > "measurements/$kind.perf.txt"
            cat "measurements/$kind.perf-status.txt"
            head -100 "measurements/$kind.perf.txt"
          done
          sudo chown -R "$(id -u):$(id -g)" measurements
      - name: Retain baseline profiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wide-vector-reduction-baseline-profiles
          path: measurements
          retention-days: 14
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wide-vector-reduction-evidence
          path: measurements
          retention-days: 14
