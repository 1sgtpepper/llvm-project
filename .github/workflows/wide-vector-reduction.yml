name: Wide vector reduction investigation
on:
  push:
    branches: [validate-wide-vector-reduction]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == '1sgtpepper/llvm-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          sparse-checkout: .ci
      - name: Preserve the investigation drivers
        run: cp -a .ci "$RUNNER_TEMP/reduction-drivers"
      - name: Check out the compiler base and candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 0e48409311a1a3fcff7714c5e3adf4aab048771c
          fetch-depth: 3
          persist-credentials: false
      - name: Record the source and host
        run: |
          mkdir -p measurements/baseline measurements/candidate
          cp -a "$RUNNER_TEMP/reduction-drivers/." .ci/
          git rev-parse HEAD > measurements/candidate-revision.txt
          git diff 0d55d0bf81ce2e0d6d3c46b7835efb788bde634a HEAD -- llvm > measurements/compiler.patch
          uname -a > measurements/kernel.txt
          lscpu > measurements/cpu.txt
          free -h > measurements/memory.txt
          git checkout --detach 0d55d0bf81ce2e0d6d3c46b7835efb788bde634a
      - name: Install build and profiling tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build clang lld linux-tools-generic
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          key: wide-vector-reduction-release-ubuntu-24.04
          max-size: 4G
      - name: Configure a release compiler without assertions
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS='-gline-tables-only -fno-omit-frame-pointer' \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_USE_LINKER=lld -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_TARGETS_TO_BUILD='NVPTX;X86' \
            -DLLVM_PARALLEL_LINK_JOBS=1 -DLLVM_INCLUDE_BENCHMARKS=OFF
          cp build/CMakeCache.txt measurements/
      - name: Build the matching release baseline
        id: baseline
        run: |
          ninja -C build -j4 llc opt FileCheck llvm-as llvm-dis llvm-config count not split-file
          cp build/bin/llc measurements/baseline/llc
          git rev-parse HEAD > measurements/baseline-revision.txt
          build/bin/llc --version > measurements/baseline-version.txt
      - name: Build the exact candidate with the same options
        id: candidate
        run: |
          git checkout --detach 0e48409311a1a3fcff7714c5e3adf4aab048771c
          ninja -C build -j4 llc
          cp build/bin/llc measurements/candidate/llc
          build/bin/llc --version > measurements/candidate-version.txt
          sha256sum measurements/{baseline,candidate}/llc > measurements/compiler.sha256
      - name: Build and run the actual queue lifecycle harness
        if: always() && steps.candidate.outcome == 'success'
        run: |
          clang++ $(build/bin/llvm-config --cxxflags) -O3 -DNDEBUG -fuse-ld=lld \
            -DUSE_SUCCESSOR_CACHE .ci/successor-cache-check.cpp \
            -o measurements/successor-cache-check \
            $(build/bin/llvm-config --ldflags --link-static --libs selectiondag x86 asmparser --system-libs)
          timeout --kill-after=5s 180s measurements/successor-cache-check \
            2>&1 | tee measurements/cache-paths.txt
      - name: Check existing reduction and backtracking regressions
        if: always() && steps.candidate.outcome == 'success'
        run: |
          build/bin/llvm-lit -v \
            llvm/test/CodeGen/NVPTX/reduction-intrinsics.ll \
            llvm/test/CodeGen/NVPTX/fp-contract-f32x2.ll \
            llvm/test/CodeGen/X86/scheduler-backtracking.ll \
            llvm/test/CodeGen/X86/rrlist-livereg-corrutpion.ll \
            llvm/test/CodeGen/X86/inlineasm-sched-bug.ll \
            2>&1 | tee measurements/regressions.txt
      - name: Compare complete release compilation
        if: always() && steps.candidate.outcome == 'success'
        run: |
          ulimit -c 0
          ulimit -v 8388608
          python3 .ci/wide-vector-reduction.py \
            --compiler baseline measurements/baseline/llc \
            --compiler candidate measurements/candidate/llc --output measurements/timing \
            --widths 1024 4096 16384 65536 --repetitions 3 --timeout 180
      - name: Measure ordinary small functions
        if: always() && steps.candidate.outcome == 'success'
        run: |
          ulimit -c 0
          ulimit -v 8388608
          python3 .ci/benchmark-small-functions.py \
            --baseline measurements/baseline/llc --candidate measurements/candidate/llc \
            --output measurements/small-functions
      - name: Profile the remaining release costs
        if: always() && steps.candidate.outcome == 'success'
        run: |
          perf_bin=$(find /usr/lib -type f -name perf | sort | tail -1)
          for kind in ordered no-reduce; do
            timeout --kill-after=5s 180s sudo "$perf_bin" record -e cpu-clock:u -F 99 \
              --call-graph fp -o "measurements/$kind.perf.data" -- \
              measurements/candidate/llc "measurements/timing/inputs/$kind-65536.ll" -o /dev/null -time-passes \
              2> "measurements/$kind.perf-status.txt"
            sudo "$perf_bin" report --stdio --no-children -g none \
              -i "measurements/$kind.perf.data" > "measurements/$kind.perf.txt"
          done
          sudo chown -R "$(id -u):$(id -g)" measurements
      - name: Retain comparison compilers and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wide-vector-reduction-release-comparison
          path: measurements
          retention-days: 14
