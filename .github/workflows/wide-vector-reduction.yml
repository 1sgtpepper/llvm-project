name: Wide vector reduction investigation
on:
  push:
    branches: [validate-wide-vector-reduction]
permissions:
  contents: read
  actions: read
jobs:
  annotate:
    if: github.repository == '1sgtpepper/llvm-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          sparse-checkout: llvm/lib/CodeGen/SelectionDAG
      - name: Recover the measured compiler and sample records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34746063798 --repo 1sgtpepper/llvm-project \
            --name wide-vector-reduction-baseline-compiler --dir build/bin
          gh run download 34748210080 --repo 1sgtpepper/llvm-project \
            --name wide-vector-reduction-baseline-profiles --dir measurements
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic
      - name: Annotate the dominant routines using the retained samples
        run: |
          perf_bin=$(find /usr/lib -type f -name perf | sort | tail -1)
          test -n "$perf_bin"
          for kind in ordered no-reduce; do
            "$perf_bin" annotate --stdio --show-nr-samples \
              -i "measurements/$kind.perf.data" \
              --symbol='closestSucc(llvm::SUnit const*)' \
              > "measurements/$kind-closest-annotated.txt"
            "$perf_bin" report --stdio --no-children -g none --sort=symbol,srcline \
              -i "measurements/$kind.perf.data" \
              > "measurements/$kind-lines.txt"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wide-vector-reduction-annotated-profiles
          path: measurements
          retention-days: 14
